name: BabyDays

options:
  bundleIdPrefix: com.caldis
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
    tvOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: zh-Hans
  # Icon Composer 的 .icon 是文件包, 需整体作为一个资源
  fileTypes:
    icon:
      file: true

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.10.0

settings:
  base:
    DEVELOPMENT_TEAM: N7Z52F27XK
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.2.1"
    CURRENT_PROJECT_VERSION: "2"
    SWIFT_VERSION: "5.0"
    GENERATE_INFOPLIST_FILE: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    # Sparkle 更新清单地址, 写入 App 与小组件的 Info.plist
    UPDATE_FEED_URL: https://github.com/Caldis/baby-days/releases/latest/download/appcast.xml
    # Sparkle EdDSA 公钥, 私钥位于 ~/.config/baby-days/sparkle_private_key 与登录钥匙串
    SPARKLE_PUBLIC_KEY: /AXBxGAnAkyLah+yTAUTMQ1a+c1Xz3t2/w/S34405Gs=

targetTemplates:
  App:
    type: application
    sources:
      - path: App
        excludes:
          - "Info-*.plist"
      - path: Shared
      - path: Resources/Fonts/ZCOOLKuaiLe-Regular.ttf
        buildPhase: resources
      - path: Resources/Assets.xcassets
      - path: Resources/AppIcon.icon
        buildPhase: resources
      # 系统语言为中文时显示 "宝宝多大", 其余语言显示 "BabyDays"
      - path: Resources/Localization
    settings:
      base:
        PRODUCT_NAME: BabyDays
        PRODUCT_BUNDLE_IDENTIFIER: com.caldis.babydays
        INFOPLIST_KEY_CFBundleDisplayName: 宝宝多大
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.lifestyle
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  Widget:
    type: app-extension
    sources:
      - path: Widget
      - path: Shared
      - path: Resources/Fonts/ZCOOLKuaiLe-Regular.ttf
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: BabyDaysWidget
        PRODUCT_BUNDLE_IDENTIFIER: com.caldis.babydays.widget
        INFOPLIST_FILE: Widget/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: 宝宝多大
        SKIP_INSTALL: YES

targets:
  BabyDays-iOS:
    templates: [App]
    platform: iOS
    dependencies:
      - target: BabyDaysWidget-iOS
    settings:
      base:
        INFOPLIST_FILE: App/Info-iOS.plist
        CODE_SIGN_ENTITLEMENTS: App/BabyDays-iOS.entitlements
        APP_GROUP_ID: group.com.caldis.babydays
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait

  BabyDays-macOS:
    templates: [App]
    platform: macOS
    dependencies:
      - target: BabyDaysWidget-macOS
      - package: Sparkle
    settings:
      base:
        INFOPLIST_FILE: App/Info-macOS.plist
        APP_GROUP_ID: N7Z52F27XK.com.caldis.babydays
        CODE_SIGN_ENTITLEMENTS: App/BabyDays.entitlements
        ENABLE_HARDENED_RUNTIME: YES

  # Mac App Store 版本: 不含 Sparkle 与更新检查, 由 App Store 负责更新
  BabyDays-macOS-AppStore:
    templates: [App]
    platform: macOS
    dependencies:
      - target: BabyDaysWidget-macOS-AppStore
    settings:
      base:
        INFOPLIST_FILE: App/Info-macOS-AppStore.plist
        APP_GROUP_ID: N7Z52F27XK.com.caldis.babydays
        CODE_SIGN_ENTITLEMENTS: App/BabyDays-AppStore.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) APP_STORE

  BabyDaysWidget-macOS-AppStore:
    templates: [Widget]
    platform: macOS
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: Widget/BabyDaysWidget-AppStore.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        APP_GROUP_ID: N7Z52F27XK.com.caldis.babydays
        UPDATE_FEED_URL: ""
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) APP_STORE

  BabyDaysWidget-iOS:
    templates: [Widget]
    platform: iOS
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: Widget/BabyDaysWidget-iOS.entitlements
        APP_GROUP_ID: group.com.caldis.babydays

  BabyDaysWidget-macOS:
    templates: [Widget]
    platform: macOS
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: Widget/BabyDaysWidget.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        APP_GROUP_ID: N7Z52F27XK.com.caldis.babydays

  BabyDays-tvOS:
    type: application
    platform: tvOS
    sources:
      - path: TV
      - path: TVShared
      - path: Shared
      - path: Resources/Fonts/ZCOOLKuaiLe-Regular.ttf
        buildPhase: resources
      - path: Resources/Assets.xcassets
      - path: Resources/TVIcon.xcassets
      - path: Resources/TVShared.xcassets
      - path: Resources/Localization
    dependencies:
      - target: BabyDaysTopShelf-tvOS
    settings:
      base:
        PRODUCT_NAME: BabyDays
        PRODUCT_BUNDLE_IDENTIFIER: com.caldis.babydays
        INFOPLIST_FILE: TV/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: 宝宝多大
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.lifestyle
        ASSETCATALOG_COMPILER_APPICON_NAME: App Icon & Top Shelf Image
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UIRequiredDeviceCapabilities: arm64
        CODE_SIGN_ENTITLEMENTS: TV/BabyDays-tvOS.entitlements
        APP_GROUP_ID: group.com.caldis.babydays
        TARGETED_DEVICE_FAMILY: "3"

  BabyDaysTopShelf-tvOS:
    type: app-extension
    platform: tvOS
    sources:
      - path: TopShelf
      - path: TVShared
      - path: Shared
      - path: Resources/Fonts/ZCOOLKuaiLe-Regular.ttf
        buildPhase: resources
      - path: Resources/TVShared.xcassets
    settings:
      base:
        PRODUCT_NAME: BabyDaysTopShelf
        PRODUCT_BUNDLE_IDENTIFIER: com.caldis.babydays.topshelf
        INFOPLIST_FILE: TopShelf/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: 宝宝多大
        INFOPLIST_KEY_UIRequiredDeviceCapabilities: arm64
        CODE_SIGN_ENTITLEMENTS: TopShelf/BabyDaysTopShelf.entitlements
        APP_GROUP_ID: group.com.caldis.babydays
        TARGETED_DEVICE_FAMILY: "3"
        SKIP_INSTALL: YES
